apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels: {app: customer-service}
  template:
    metadata:
      labels: {app: customer-service}
    spec:
      containers:
        - name: customer-service
          image: siwarsrairi/customer-service:1.1
          env:
            - {name: JAVA_TOOL_OPTIONS, value: "-Xmx256m"}
            - {name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, value: "http://discovery-server:8761/eureka/"}
            - {name: EUREKA_INSTANCE_PREFER_IP_ADDRESS, value: "true"}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://host.minikube.internal:5432/customer_db"}
            - {name: FDP_SECURITY_JWKSETURI, value: "http://192.168.49.1:8180/realms/fdp/protocol/openid-connect/certs"}
            - {name: FDP_SECURITY_JWK_SET_URI, value: "http://192.168.49.1:8180/realms/fdp/protocol/openid-connect/certs"}
