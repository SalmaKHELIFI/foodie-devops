apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels: {app: discovery-server}
  template:
    metadata:
      labels: {app: discovery-server}
    spec:
      containers:
        - name: discovery-server
          image: siwarsrairi/discovery-server:1.0
          ports:
            - containerPort: 8761
          env:
            - {name: JAVA_TOOL_OPTIONS, value: "-Xmx256m"}
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: food-delivery
spec:
  selector: {app: discovery-server}
  ports:
    - {port: 8761, targetPort: 8761}
