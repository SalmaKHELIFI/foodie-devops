apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: siwarsrairi/food-delivery-frontend:1.2
          ports:
            - containerPort: 443
          volumeMounts:
            - {name: certs, mountPath: /etc/nginx/certs, readOnly: true}
            - {name: nginxconf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
      volumes:
        - name: certs
          secret: {secretName: frontend-tls}
        - name: nginxconf
          configMap: {name: frontend-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: food-delivery
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - {port: 443, targetPort: 443, nodePort: 30443}
